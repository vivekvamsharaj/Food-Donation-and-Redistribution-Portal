{% extends "base.html" %}{% block title %}Donate food{% endblock %}
{% block content %}<div class="form-wrap wide"><div class="form-panel"><span class="eyebrow">MAKE A DONATION</span><h1 class="h2 fw-bold mt-2">List surplus food</h1><p class="text-muted">Please provide accurate details so recipients can collect it safely.</p>
<form method="post" id="donationForm">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Food name *</label><input class="form-control" name="food_name" required maxlength="150" placeholder="e.g. Vegetable rice"></div>
<div class="col-md-6"><label class="form-label">Category *</label><select class="form-select" name="category" required><option>Cooked meal</option><option>Packaged</option><option>Produce</option><option>Bakery</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label">Quantity *</label><input class="form-control" type="number" name="quantity" min="0.1" step="0.1" required></div>
<div class="col-md-6"><label class="form-label">Unit *</label><select class="form-select" name="unit"><option>servings</option><option>kg</option><option>boxes</option><option>packets</option></select></div>
<div class="col-12"><label class="form-label">Pickup location *</label><input class="form-control" name="location" required maxlength="255" placeholder="Area, landmark, city"></div>
<div class="col-md-6"><label class="form-label">Preparation / packing time *</label><input class="form-control" type="datetime-local" name="prepared_at" id="prepared" required></div>
<div class="col-md-6"><label class="form-label">Safe-consumption deadline *</label><input class="form-control" type="datetime-local" name="safe_until" id="safeUntil" required></div>
<div class="col-12"><label class="form-label">Storage / allergen / pickup notes</label><textarea class="form-control" name="notes" rows="3" maxlength="2000" placeholder="Mention storage conditions and known allergens. Do not claim food is allergen-free unless verified."></textarea></div>
</div>
<div class="safety-note my-3"><strong>Safety confirmation:</strong> <label class="d-inline"><input type="checkbox" required> I confirm the food is not spoiled or contaminated, and the times and storage details are accurate.</label></div>
<div id="timeError" class="text-danger small mb-2"></div><button class="btn btn-success">Publish donation</button> <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
</form></div></div>{% endblock %}
