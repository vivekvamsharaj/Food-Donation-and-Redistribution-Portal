{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-panel"><span class="eyebrow">JOIN THE COMMUNITY</span><h1 class="h2 fw-bold mt-2">Create an account</h1><p class="text-muted">Choose how you want to contribute.</p>
<form method="post" class="needs-validation" novalidate>
<label class="form-label">Full name / organization</label><input class="form-control mb-3" name="name" required maxlength="100">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Phone (optional)</label><input class="form-control mb-3" name="phone" maxlength="30">
<label class="form-label">Account type</label><select class="form-select mb-3" name="role" required><option value="Donor">Food donor</option><option value="NGO">NGO / receiver</option><option value="Volunteer">Volunteer</option></select>
<label class="form-label">Password</label><input class="form-control mb-1" type="password" name="password" minlength="8" required><div class="form-text mb-3">At least 8 characters. Use a unique password.</div>
<button class="btn btn-success w-100">Create account</button></form><p class="mt-3 mb-0 small">NGO and volunteer accounts require admin verification before login.</p></div></div>{% endblock %}
