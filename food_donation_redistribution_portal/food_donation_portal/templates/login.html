{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-panel"><span class="eyebrow">WELCOME BACK</span><h1 class="h2 fw-bold mt-2">Log in to SharePlate</h1><form method="post" class="mt-4">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-success w-100">Log in</button></form><p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
